name: Test output from main command

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          main: 'echo "result=hello-world" >> "$GITHUB_OUTPUT"'
          post: 'echo "POST done"'

      - name: Assert output from main command
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "hello-world" ]; then
            echo "FAIL: expected 'hello-world' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: output correctly set by main command"
