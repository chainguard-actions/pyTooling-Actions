name: Test basic usage - main command runs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare temp file for main step output
        run: |
          echo "" > /tmp/main-ran.txt

      - id: action
        uses: .
        with:
          main: 'echo "Hello from main step" && echo "main_ran=true" >> /tmp/main-ran.txt'
          post: 'echo "Hello from post step"'

      - name: Assert main step ran
        run: |
          echo "Checking that the main command ran"
          CONTENT=$(cat /tmp/main-ran.txt)
          echo "Content: $CONTENT"
          if echo "$CONTENT" | grep -q "main_ran=true"; then
            echo "PASS: main command ran successfully"
          else
            echo "FAIL: main command did not produce expected output"
            exit 1
          fi

      - name: Assert action step succeeded
        run: |
          echo "Action step completed successfully (exit 0)"
          echo "PASS: action step completed"
