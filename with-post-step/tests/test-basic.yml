name: Test basic usage - main and post commands

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output file
        run: |
          rm -f /tmp/main-ran.txt

      - id: action
        uses: .
        with:
          main: 'echo "main step executed" > /tmp/main-ran.txt'
          post: 'echo "post step executed"'

      - name: Assert main command ran
        run: |
          CONTENT="$(cat /tmp/main-ran.txt 2>/dev/null || echo '')"
          echo "main output: $CONTENT"
          if ! echo "$CONTENT" | grep -q "main step executed"; then
            echo "FAIL: main command did not run as expected"
            exit 1
          fi
          echo "PASS: main command ran successfully"
