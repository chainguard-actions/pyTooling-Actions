name: Test basic usage - main command runs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment
        run: |
          # Ensure GITHUB_STATE file exists and is writable
          STATE_FILE="${GITHUB_STATE:-/tmp/github_state_basic}"
          mkdir -p "$(dirname "$STATE_FILE")"
          touch "$STATE_FILE"
          echo "GITHUB_STATE=$STATE_FILE" >> "$GITHUB_ENV"
          echo "" > /tmp/main-ran.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          main: 'echo "main step executed" > /tmp/main-ran.txt'
          post: 'echo "post step executed"'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f /tmp/main-ran.txt ]; then
              echo "FAIL: /tmp/main-ran.txt not found"
              exit 1
            fi
            CONTENT="$(cat /tmp/main-ran.txt)"
            echo "content: $CONTENT"
            if echo "$CONTENT" | grep -q "main step executed"; then
              echo "PASS: main command ran successfully"
            else
              echo "FAIL: expected 'main step executed' in output, got: $CONTENT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (node24 runtime may not be available in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
