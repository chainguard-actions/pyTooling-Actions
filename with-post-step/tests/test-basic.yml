name: Test basic usage - main command runs

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          main: 'echo "main step executed" > /tmp/main-ran.txt'
          post: 'echo "post step executed" > /tmp/post-ran.txt'

      - name: Assert main command ran
        run: |
          if [ ! -f /tmp/main-ran.txt ]; then
            echo "FAIL: main command did not create expected file"
            exit 1
          fi
          CONTENT=$(cat /tmp/main-ran.txt)
          echo "main output: $CONTENT"
          if [ "$CONTENT" != "main step executed" ]; then
            echo "FAIL: unexpected content in main output file"
            exit 1
          fi
          echo "PASS: main command ran successfully"

      - name: Assert post command did NOT run during main step
        run: |
          if [ -f /tmp/post-ran.txt ]; then
            echo "FAIL: post command ran during main step (should not have)"
            exit 1
          fi
          echo "PASS: post command correctly did not run during main step"
