name: Test multiline/complex main command

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure GITHUB_STATE file exists
        run: |
          if [ -n "$GITHUB_STATE" ] && [ ! -f "$GITHUB_STATE" ]; then
            touch "$GITHUB_STATE"
          fi

      - id: action
        uses: .
        with:
          main: |
            echo "step1 done"
            echo "step2 done"
            echo "Both steps completed"
          post: 'echo "cleanup done"'

      - name: Assert action step succeeded with multiline command
        run: |
          echo "PASS: action step with multiline main command completed without error"
