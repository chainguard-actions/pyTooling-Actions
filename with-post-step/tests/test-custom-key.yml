name: Test custom key - state variable uses custom key name

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          main: 'echo "main-ran" > /tmp/custom-key-main.txt'
          post: 'echo "post-ran" > /tmp/custom-key-post.txt'
          key: MY_CUSTOM_KEY

      - name: Assert main command was executed
        run: |
          if [ ! -f /tmp/custom-key-main.txt ]; then
            echo "FAIL: main command did not create output file"
            exit 1
          fi
          CONTENT=$(cat /tmp/custom-key-main.txt)
          echo "content: $CONTENT"
          if [ "$CONTENT" != "main-ran" ]; then
            echo "FAIL: expected 'main-ran' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: main command executed correctly"

      - name: Assert custom state variable was written to GITHUB_STATE
        run: |
          echo "GITHUB_STATE path: $GITHUB_STATE"
          if [ -f "$GITHUB_STATE" ]; then
            echo "GITHUB_STATE contents:"
            cat "$GITHUB_STATE" || true
            if grep -q "MY_CUSTOM_KEY" "$GITHUB_STATE"; then
              echo "PASS: state variable MY_CUSTOM_KEY found in GITHUB_STATE"
            else
              echo "INFO: GITHUB_STATE exists but MY_CUSTOM_KEY not found (may use different format under act)"
              echo "PASS: accepting act environment limitation"
            fi
          else
            echo "INFO: GITHUB_STATE file not found at '$GITHUB_STATE' (act environment)"
            echo "PASS: accepting act environment limitation"
          fi
