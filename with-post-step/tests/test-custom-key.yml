name: Test custom key input

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sentinel file target directory
        run: mkdir -p /tmp/test-custom-key

      - id: action
        uses: .
        with:
          main: 'echo "custom key main executed" > /tmp/test-custom-key/main-ran.txt'
          post: 'echo "custom key post executed" > /tmp/test-custom-key/post-ran.txt'
          key: MY_CUSTOM_KEY

      - name: Assert main command ran with custom key
        run: |
          if [ ! -f /tmp/test-custom-key/main-ran.txt ]; then
            echo "FAIL: main command did not create the expected file"
            exit 1
          fi
          CONTENT="$(cat /tmp/test-custom-key/main-ran.txt)"
          echo "main output: $CONTENT"
          if ! echo "$CONTENT" | grep -q "custom key main executed"; then
            echo "FAIL: main command output not as expected"
            exit 1
          fi
          echo "PASS: main command ran successfully with custom key"
