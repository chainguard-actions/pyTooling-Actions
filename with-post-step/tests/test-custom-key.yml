name: Test custom key name

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure GITHUB_STATE file exists
        run: |
          if [ -n "$GITHUB_STATE" ] && [ ! -f "$GITHUB_STATE" ]; then
            touch "$GITHUB_STATE"
          fi

      - id: action
        uses: .
        with:
          main: 'echo "custom key main ran"'
          post: 'echo "custom key post ran"'
          key: MY_CUSTOM_KEY

      - name: Assert action step succeeded with custom key
        run: |
          echo "PASS: action step with custom key completed without error"
