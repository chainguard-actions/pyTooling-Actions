name: Test multi-command main script

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          main: |
            echo "step1" > /tmp/multi-output.txt
            echo "step2" >> /tmp/multi-output.txt
            echo "step3" >> /tmp/multi-output.txt
          post: 'echo "post cleanup"'

      - name: Assert action step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed, got: $OUTCOME"
            exit 1
          fi
          echo "PASS"

      - name: Assert all multi-command steps ran
        run: |
          if [ ! -f /tmp/multi-output.txt ]; then
            echo "FAIL: /tmp/multi-output.txt not found"
            exit 1
          fi
          CONTENT=$(cat /tmp/multi-output.txt)
          echo "content: $CONTENT"
          if echo "$CONTENT" | grep -q "step1" && echo "$CONTENT" | grep -q "step2" && echo "$CONTENT" | grep -q "step3"; then
            echo "PASS: all multi-command steps ran"
          else
            echo "FAIL: not all steps found in output: $CONTENT"
            exit 1
          fi
