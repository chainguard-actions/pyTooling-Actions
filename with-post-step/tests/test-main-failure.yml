name: Test main command failure propagates exit code

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare state file
        run: |
          STATE_FILE="/tmp/github_state_failure_$$"
          touch "$STATE_FILE"
          echo "GITHUB_STATE=$STATE_FILE" >> "$GITHUB_ENV"
          echo "State file: $STATE_FILE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          main: 'exit 1'
          post: 'echo "POST_STEP"'
          key: POST

      - name: Assert action failed due to main command exit code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when main command exited with non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
