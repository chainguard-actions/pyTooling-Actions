name: Test main command failure

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          main: 'exit 1'
          post: 'echo "POST_STEP_EXECUTED"'

      - name: Assert action failed due to main command failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when main command exits 1, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when main command exited non-zero"
