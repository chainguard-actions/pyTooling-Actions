name: Test main command failure propagation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          main: 'exit 1'
          post: 'echo "Post step"'

      - name: Assert action failed due to main command exit code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly propagated main command failure"
          else
            echo "FAIL: expected failure outcome but got '$OUTCOME'"
            exit 1
          fi
