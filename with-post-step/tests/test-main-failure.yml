name: Test failing main command propagates exit code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          main: |
            echo "about to fail" > /tmp/with-post-fail.txt
            exit 3
          post: "true"
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ ! -f /tmp/with-post-fail.txt ]; then
            echo "FAIL: main command did not run"
            exit 1
          fi
          echo "PASS"
