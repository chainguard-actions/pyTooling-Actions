name: Test main command failure propagation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment
        run: |
          # Ensure GITHUB_STATE file exists and is writable
          STATE_FILE="${GITHUB_STATE:-/tmp/github_state_failure}"
          mkdir -p "$(dirname "$STATE_FILE")"
          touch "$STATE_FILE"
          echo "GITHUB_STATE=$STATE_FILE" >> "$GITHUB_ENV"
          # Remove marker from any previous run
          rm -f /tmp/failure-test-ran.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          # On first run (main step): create marker and exit 1 (fail)
          # On second run (post step, if act doesn't pass state): marker exists, exit 0 (safe)
          main: 'if [ -f /tmp/failure-test-ran.txt ]; then echo "second run ok"; else touch /tmp/failure-test-ran.txt && exit 1; fi'
          post: 'echo "post step executed"'

      - name: Assert action ran (failure expected from main command)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly propagated main command failure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (exit code propagation may be async in node runtime)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
