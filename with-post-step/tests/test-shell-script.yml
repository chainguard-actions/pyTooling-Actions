name: Test shell script as main command

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output directory
        run: mkdir -p /tmp/test-shell-script

      - id: action
        uses: .
        with:
          main: |
            echo "line1" > /tmp/test-shell-script/output.txt
            echo "line2" >> /tmp/test-shell-script/output.txt
            echo "line3" >> /tmp/test-shell-script/output.txt
          post: 'echo "post cleanup"'

      - name: Assert multi-line shell script ran correctly
        run: |
          if [ ! -f /tmp/test-shell-script/output.txt ]; then
            echo "FAIL: output file not created by shell script"
            exit 1
          fi
          LINE_COUNT="$(wc -l < /tmp/test-shell-script/output.txt)"
          echo "line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -ne 3 ]; then
            echo "FAIL: expected 3 lines in output, got $LINE_COUNT"
            exit 1
          fi
          echo "PASS: multi-line shell script executed correctly"
